<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080810" />
  <meta name="background-color" content="#080810" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zombies" />
  <meta name="application-name" content="Zombie Shooter" />
  <meta name="description" content="Survive endless waves of zombies. Mobile-first top-down shooter." />
  <title>Zombie Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #080810;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
    }
    #game {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    #game canvas { display: block !important; }

    #rotate-prompt {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10000;
      background: #080810;
      color: #ffffff;
      align-items: center; justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #rotate-prompt .icon { font-size: 84px; margin-bottom: 24px; animation: rotate-hint 2s ease-in-out infinite; }
    #rotate-prompt h2 { font-size: 22px; color: #ffcc00; margin-bottom: 12px; }
    #rotate-prompt p  { font-size: 16px; color: #aaaaaa; line-height: 1.5; max-width: 320px; }
    @keyframes rotate-hint {
      0%, 100% { transform: rotate(-15deg); }
      50%      { transform: rotate(75deg); }
    }

    @media (orientation: portrait) {
      #rotate-prompt  { display: flex; }
    }

    #boot-status {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #666;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 5;
    }

    #fatal-error {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #200;
      color: #fff;
      padding: 20px;
      overflow: auto;
      font-family: monospace;
      font-size: 12px;
      z-index: 20000;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="boot-status">Loading game…</div>
  <div id="game"></div>
  <div id="rotate-prompt">
    <div class="icon">📱</div>
    <h2>Please rotate your device</h2>
    <p>This game is designed for landscape orientation. Turn your phone sideways to play!</p>
  </div>
  <div id="fatal-error"></div>
  <script>
    // Inject PWA links dynamically so Vite's HTML transform doesn't hash/move
    // their hrefs — the manifest and icons must stay at their original paths
    // (./manifest.webmanifest, ./icons/...) so the manifest's relative icon
    // paths resolve correctly relative to the site root.
    (function () {
      function addLink(rel, href, attrs) {
        var l = document.createElement('link');
        l.rel = rel; l.href = href;
        if (attrs) for (var k in attrs) l.setAttribute(k, attrs[k]);
        document.head.appendChild(l);
      }
      addLink('manifest',         './manifest.webmanifest');
      addLink('icon',             './icons/favicon-32.png',     { type: 'image/png', sizes: '32x32' });
      addLink('icon',             './icons/icon-192.png',       { type: 'image/png', sizes: '192x192' });
      addLink('apple-touch-icon', './icons/apple-touch-icon.png');
    })();

    function showFatal(msg) {
      const el = document.getElementById('fatal-error');
      if (el) { el.style.display = 'block'; el.textContent = msg; }
    }
    window.addEventListener('error', (e) => {
      showFatal('Error: ' + e.message + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
    });
    window.addEventListener('unhandledrejection', (e) => {
      showFatal('Promise rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });

    // Reliably hide loading text once Phaser canvas appears in the DOM.
    // Module scripts defer; Phaser READY can fire before any listener attaches,
    // so we don't rely on Phaser events — we poll for the canvas instead.
    window.hideBootStatus = function () {
      const el = document.getElementById('boot-status');
      if (el) el.style.display = 'none';
    };
    var _bootPoll = setInterval(function () {
      if (document.querySelector('#game canvas')) {
        window.hideBootStatus();
        clearInterval(_bootPoll);
      }
    }, 100);
    // Hard fallback — never let the loading text persist past 6s
    setTimeout(function () {
      window.hideBootStatus();
      clearInterval(_bootPoll);
    }, 6000);

    // Register service worker for PWA installability + offline cache
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }

    // Capture beforeinstallprompt so we can offer a custom install UX later
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window._installPrompt = e;
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
